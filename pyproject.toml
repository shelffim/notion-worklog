[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notion-worklog"
version = "0.1.0"
description = "Record Claude Code and Codex CLI sessions into a Notion database, automatically."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "shelffim" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
notion-worklog = "notion_worklog.cli:main"

[project.urls]
Homepage = "https://github.com/shelffim/notion-worklog"

[tool.hatch.build.targets.wheel]
packages = ["src/notion_worklog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
